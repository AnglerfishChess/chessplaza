[project]
name = "chessplaza"
version = "0.1.0"
description = "A virtual chess plaza: AI chess hustlers with distinct personalities, played by Claude agents over any UCI engine, in your terminal."
authors = [
    {name = "Alex Myodov", email = "amyodov@gmail.com"}
]
license = {text = "MIT License"}
readme = "README.md"
keywords = [
    "chess",
    "AI",
    "LLM",
    "Claude",
    "agents",
    "chess hustler",
    "game",
    "anthropic"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent"
]
requires-python = ">=3.12"

dependencies = [
    "claude-agent-sdk>=0.2.152",
    "click>=8.1.8,<9.0.0",
    "esca>=0.3,<0.4",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/AnglerfishChess/chessplaza"
Repository = "https://github.com/AnglerfishChess/chessplaza"
Issues = "https://github.com/AnglerfishChess/chessplaza/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
gui = [
    "PySide6>=6.6.0",
]
voice = [
    "edge-tts>=7.0.0",
    "google-genai>=1.0.0",
    "miniaudio>=1.60",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0.0",
    "pyrefly>=0.16.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-claude-agent-sdk>=0.1.0",
    "ruff>=0.11.4",
]

[project.scripts]
chessplaza = "chessplaza.__main__:main"

[tool.setuptools]
package-dir = {"" = "."}
packages = ["chessplaza"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Prompt text, wrapped where the prompt wants it rather than where the linter does.
"chessplaza/hustler.py" = ["E501"]

[tool.pyrefly]
project-includes = ["chessplaza", "tests"]
# The `voice` and `gui` extras are not installed for a type check.
replace-imports-with-any = ["edge_tts", "miniaudio", "google", "google.*", "PySide6.*"]
search-path = [".", "tests"]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "--strict-markers -ra -m 'not llm'"
asyncio_mode = "strict"
markers = [
    "llm: personality test judged by a live Claude session",
]
